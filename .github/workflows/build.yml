name: GrowAPet build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and verify
        run: ./mvnw --batch-mode -Dcoverage-gate clean verify
      - name: Inspect shaded JAR
        shell: bash
        run: |
          test -f target/growapet-1.0.0.jar
          ! jar tf target/growapet-1.0.0.jar | grep -E '(^|/)(org/junit|org/mockbukkit|io/github/drownek/plugwright|src/test/)'

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make wrappers executable
        run: chmod +x mvnw e2e/gradlew
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: e2e/src/test/e2e/package-lock.json
      - name: Run real Paper smoke suite
        run: ./e2e/gradlew -p e2e plugwrightTest -PtestFiles=smoke-
