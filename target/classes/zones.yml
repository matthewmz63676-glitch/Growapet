# Zone definitions, including warp coordinates used by ZoneManager/WarpMenu.
# Coordinates are placeholders (world "world", spaced 100 blocks apart along X) —
# the server owner should edit these to match the actual built zones.
# Every zone also requires the named WorldGuard cuboid region. Missing or
# non-cuboid regions disable zone-bound spawning, displays, and culling.
#
# Optional per-zone extras (all default to "not required"/"no wall"):
#   free: true            # players can use this zone immediately, no unlock
#                          # purchase required (in addition to "spawn", which
#                          # is always implicitly free regardless of this key).
#   req-level: 20        # minimum player level required, on top of coin/gem cost
#   gem-cost: 100         # gem cost in addition to the coin "cost" below
#   wall:                 # a physical Petcore-style zone gate: fake black glass
#     world: "world"      # covers this cuboid until the zone is unlocked, then a
#     x1: 95              # spectator-mode break cutscene plays. Omit the whole
#     y1: 60               # "wall:" block entirely for an instant-unlock zone
#     z1: -10              # with no physical gate (the old behaviour).
#     x2: 105
#     y2: 90
#     z2: 10
#     cam-x: 100           # optional cutscene camera pose; omit cam-x to skip
#     cam-y: 100           # the spectator cutscene and just unlock instantly
#     cam-z: -20           # once the wall gate itself is configured.
#     cam-yaw: 0
#     cam-pitch: 0
#
# Approved final 10-zone lineup (replaces the old Forest/Plains/Mushroom/.../
# Ancient Realm progression). "plains" is marked free so a brand new player can
# always earn mob rewards immediately without needing to buy their way into the
# first zone — see mobs/MobRewards.java for the reward gate this satisfies.
zones:
  spawn:
    region: "growapet_spawn"
    display-name: "Spawn"
    order: 0
    cost: 0
    world: "world"
    x: 0
    y: 100
    z: 0
