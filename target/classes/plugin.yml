main: me.growapet.GrowAPet
version: 1.0.0
name: GrowAPet
author: Justanother_Game
description: A pet progression plugin featuring mob zones, pet collection, rebirths, upgrades and custom combat.
api-version: 1.21

depend: [packetevents, WorldGuard]
soft-depend: [PlaceholderAPI, LuckPerms, Tebex]

commands:
  growapet:
    description: GrowAPet admin command
    usage: /growapet <doctor|reload|give|setlevel|setcoins|setgems|setcredits|event|creditreceipt|economy-sim|commerce|season|shopmigration|discord>
  plot:
    description: Manage your plot
    usage: /plot [home|visit <player>|exit|settings]
  pets:
    description: View your pets
    usage: /pets
  warp:
    description: Open the warp GUI
    usage: /warp
  zones:
    description: View zones
    usage: /zones
  quests:
    description: View your quests
    usage: /quests [claim <questId>]
  trade:
    description: Trade with another player
    usage: /trade <player|accept|offer|confirm|cancel>
  stats:
    description: View your stats
    usage: /stats
  leaderboard:
    description: View leaderboards
    aliases: [leaderboards]
    usage: /leaderboard [coins|gems|credits|level|mobkills|bosskills|damage|coinmulti|gemsmulti|power|playtime|eggs|pets|trades|highestpet]
  boss:
    description: View active boss info
    usage: /boss [spawn <bossId>]
  options:
    description: View plugin options
    usage: /options [actionbar|trade]
  visit:
    description: Visit another player's plot
    usage: /visit <player>
  getmob:
    description: Get a mob spawn item (admin)
    usage: /getmob <player> <mob_name>
  mobspawn:
    description: Manage persistent GrowAPet mob population points (admin)
    usage: /mobspawn <set|remove|list> [id] [mob] [max]
  getegg:
    description: Get an egg item (admin)
    usage: /getegg <player> <entityType> [incubateSeconds]
  getpet:
    description: Get a customized spawn egg (admin)
    usage: /getpet <player> <mob_name>
  shop:
    description: Open gear, multiplier, and egg shops
    usage: /shop [eggs]
  spawn:
    description: Teleport to spawn
    usage: /spawn
  setspawn:
    description: Set the server spawn location (admin)
    usage: /setspawn
  store:
    description: Open the Credits store
    usage: /store
  unlockzone:
    description: Force-unlock a zone for a player (admin)
    usage: /unlockzone <player> <zoneId>
  autokill:
    description: Instantly defeat the tracked GrowAPet mob in your crosshair
    usage: /autokill
  daily:
    description: Claim the free 24-hour Credit reward
    usage: /daily
  tutorial:
    description: Start or manage the GrowAPet onboarding tutorial
    usage: /tutorial [start|stop] or /tutorial <start|stop|reset|setpoint|preview|validate> ...
  link:
    description: Generate a Discord account link code
    usage: /link
  checklink:
    description: Check Discord account link status
    usage: /checklink
  unlink:
    description: Remove your Discord account link
    usage: /unlink
  season:
    description: Open the active seasonal journal
    usage: /season [seasonId]
  cosmetics:
    description: Select owned chat cosmetics
    usage: /cosmetics

permissions:
  growapet.admin:
    description: Access to all GrowAPet admin commands
    default: op
    children:
      growapet.admin.reload: true
      growapet.admin.doctor: true
      growapet.admin.economy: true
      growapet.admin.give: true
      growapet.admin.mob: true
      growapet.admin.boss: true
      growapet.admin.spawn: true
      growapet.admin.zones: true
      growapet.admin.events: true
      growapet.admin.bypass: true
      growapet.admin.leaderboards: true
      growapet.command-blacklist.bypass: true
      growapet.admin.tutorial: true
      growapet.tutorial: true
      growapet.admin.seasons: true
      growapet.admin.shopmigration: true
      growapet.admin.discord: true
  growapet.admin.reload: { default: op }
  growapet.admin.doctor:
    description: Run read-only GrowAPet readiness diagnostics
    default: op
  growapet.admin.economy: { default: op }
  growapet.admin.give: { default: op }
  growapet.admin.mob: { default: op }
  growapet.admin.boss: { default: op }
  growapet.admin.spawn: { default: op }
  growapet.admin.zones: { default: op }
  growapet.admin.events: { default: op }
  growapet.admin.bypass: { default: op }
  growapet.admin.leaderboards: { default: op }
  growapet.command-blacklist.bypass:
    description: Bypass GrowAPet's player command blacklist
    default: op
  growapet.admin.tutorial:
    description: Start, stop, or reset another player's tutorial
    default: op
  growapet.admin.seasons: { default: op }
  growapet.admin.shopmigration: { default: op }
  growapet.admin.discord: { default: op }
  growapet.tutorial:
    description: Use the GrowAPet tutorial
    default: true
  growapet.chat.color:
    description: Use & colour codes and #RRGGBB hex codes in chat
    default: op
  growapet.autokill:
    description: Use /autokill on tracked GrowAPet mobs
    default: op
  growapet.discord.link:
    description: Link or inspect your Discord account
    default: true
  growapet.cosmetics:
    description: Open the GrowAPet cosmetics selector
    default: true
