# Mob rewards. Key = Bukkit EntityType name. Coins/gems/exp scale with the zone's
# tier (mirrors the zones.yml cost curve: plains -> mushroom_island).
# health: customizable max HP applied when the mob is spawned (via /getmob or zone spawners).
# no-ai: when true, the mob is spawned with vanilla AI disabled (NoAI).
# hit-sound: played (with a custom hurt-flash animation) on every hit that lands,
# since the plugin cancels the vanilla damage event to run its own HP/reward
# pipeline, which otherwise silently swallows the normal hit animation/sound.
mobs:
  ZOMBIE:
    display-name: "Zombie"
    health: 20
    damage: 3
    no-ai: true
    coins: 3
    gems: 0
    exp: 5
    respawn-seconds: 5
    zone: plains
    hit-sound: "entity.zombie.hurt"
